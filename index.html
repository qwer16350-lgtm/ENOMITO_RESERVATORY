<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>INOMITO Observatory</title>
  </head>
  <body>
    <main>
      <header><h1>ENOMITO OBSERVATORY</h1></header>
      <nav aria-label="맵 조작"><button id="world-reset" type="button">새 월드</button> <span id="world-seed"></span></nav>
      <div id="game-wrapper">
        <div id="game" aria-label="관측소 기본 화면"></div>
        <section id="loading-screen" role="status" aria-live="polite" aria-label="관측소 연결 중">
          <div class="boot-label">ENOMITO / OBSERVATION SYSTEM</div>
          <img class="boot-mito" src="/assets/mito/pink-star/idle_S.png" alt="" />
          <h2>관측 신호를 연결하고 있습니다…</h2>
          <div class="boot-progress" role="progressbar" aria-label="관측소 준비" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
          <p id="loading-stage">관측 장치를 켜는 중</p>
          <span class="boot-live">● SIGNAL CONNECTING</span>
          <button id="loading-retry" type="button" hidden>다시 연결</button>
        </section>
        <div class="live-indicator" aria-label="LIVE"><span class="live-dot" aria-hidden="true"></span><span>LIVE</span></div>
        <div id="character-profile" role="tooltip" aria-label="캐릭터 프로필" hidden>
          <strong data-field="name"></strong>
          <dl><dt>나이 · 도착 후</dt><dd data-field="age"></dd><dt>유형</dt><dd data-field="type"></dd><dt>세대</dt><dd data-field="generation"></dd><dt>행동</dt><dd data-field="behavior"></dd></dl>
        </div>
        <aside class="minimized" id="minimap" aria-label="전체 맵 미니맵">
          <div class="minimap-header"><span class="minimap-title">전체 맵</span><button id="minimap-toggle" type="button" aria-expanded="false" aria-controls="minimap-content" aria-label="미니맵 펼치기" aria-keyshortcuts="M" title="지도 접힘/미니맵/전체 지도 전환 (M)">+</button></div>
          <div id="minimap-content" hidden>
          <svg viewBox="0 0 220 130" role="img" aria-label="흰색 테두리는 카메라 범위, 밝은 초록 점은 나무, 회색 점은 바위, 형광 초록 점은 캐릭터 위치">
            <polygon points="110,16 208,65 110,114 12,65" fill="#2b5146" stroke="#6c9a83" stroke-width="1" />
            <path d="M61 40.5 L159 89.5 M159 40.5 L61 89.5 M12 65 H208 M110 16 V114" stroke="#456e5c" stroke-width="0.5" fill="none" />
            <circle id="minimap-character" cx="110" cy="65" r="1.8" fill="#39ff14" />
            <rect id="minimap-camera" x="0" y="0" width="0" height="0" fill="none" stroke="#ffffff" stroke-width="1.2" />
          </svg>
          <div class="minimap-legend"><span class="camera-key"></span> 카메라 <span class="tree-key"></span> 나무 <span class="rock-key"></span> 바위 <span class="water-key"></span> 물 <button id="minimap-focus-character" type="button" title="캐릭터를 화면 중앙으로"><span class="character-key"></span> 캐릭터</button></div>
          </div>
        </aside>
      </div>
      <p id="status" role="status"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
